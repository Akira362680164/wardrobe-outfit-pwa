services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - wardrobe-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wardrobe-cloud

  wardrobe-api:
    image: ${WARDROBE_API_IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      WARDROBE_STORAGE_ROOT: /var/lib/wardrobe-api/storage
      ASSET_MAX_BYTES: ${ASSET_MAX_BYTES:-15728640}
      DIAGNOSTIC_HASH_SECRET: ${DIAGNOSTIC_HASH_SECRET}
      AUTH_HMAC_SECRET: ${AUTH_HMAC_SECRET}
      WECHAT_MINIPROGRAM_APP_ID: "${WECHAT_MINIPROGRAM_APP_ID:?WECHAT_MINIPROGRAM_APP_ID is required}"
      WECHAT_MINIPROGRAM_APP_SECRET: "${WECHAT_MINIPROGRAM_APP_SECRET:?WECHAT_MINIPROGRAM_APP_SECRET is required}"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}
      TENCENT_SES_REGION: ${TENCENT_SES_REGION:-ap-hongkong}
      TENCENT_SES_ENDPOINT: ${TENCENT_SES_ENDPOINT:-ses.tencentcloudapi.com}
      TENCENT_SES_FROM: ${TENCENT_SES_FROM:-}
      TENCENT_SES_REPLY_TO: ${TENCENT_SES_REPLY_TO:-}
      TENCENT_SES_VERIFY_TEMPLATE_ID: ${TENCENT_SES_VERIFY_TEMPLATE_ID:-}
      IMAGE_CROP_SIDECAR_COMMAND: /app/services/image-crop-sidecar/wardora-crop-sidecar
      IMAGE_CROP_MODEL_PATH: /opt/wardrobe-models/u2netp.onnx
      IMAGE_CROP_TIMEOUT_MS: ${IMAGE_CROP_TIMEOUT_MS:-45000}
      IMAGE_CROP_CONCURRENCY: ${IMAGE_CROP_CONCURRENCY:-1}
      IMAGE_CROP_QUEUE_LIMIT: ${IMAGE_CROP_QUEUE_LIMIT:-20}
      DAILY_RECOMMENDATIONS_ENABLED: ${DAILY_RECOMMENDATIONS_ENABLED:-true}
      RECOMMENDATION_V2_SHADOW_ENABLED: ${RECOMMENDATION_V2_SHADOW_ENABLED:-false}
      RECOMMENDATION_V2_CURRENT_ENABLED: ${RECOMMENDATION_V2_CURRENT_ENABLED:-false}
      RECOMMENDATION_V2_WORKER_ENABLED: ${RECOMMENDATION_V2_WORKER_ENABLED:-false}
      RECOMMENDATION_REALTIME_ENABLED: ${RECOMMENDATION_REALTIME_ENABLED:-false}
      RECOMMENDATION_ACCEPT_ENABLED: ${RECOMMENDATION_ACCEPT_ENABLED:-false}
      PAW_DATE_CONTEXT_ENABLED: "false"
      PAW_CANDIDATE_EVALUATOR_ENABLED: "false"
      PAW_INTAKE_CANONICALIZER_ENABLED: "false"
      QWEATHER_ENABLED: ${QWEATHER_ENABLED:-false}
      QWEATHER_API_HOST: ${QWEATHER_API_HOST:-}
      QWEATHER_PROJECT_ID: ${QWEATHER_PROJECT_ID:-}
      QWEATHER_CREDENTIAL_ID: ${QWEATHER_CREDENTIAL_ID:-}
      QWEATHER_PRIVATE_KEY_FILE: /run/secrets/qweather/ed25519-private.pem
      QWEATHER_ALERTS_ENABLED: "false"
      HISTORICAL_CLIMATE_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /opt/wardrobe-cloud/secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - /opt/wardrobe-cloud/secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - /opt/wardrobe-cloud/secrets/refresh-idempotency.key:/run/secrets/refresh-idempotency.key:ro
      - /srv/wardrobe/storage:/var/lib/wardrobe-api/storage
      - /opt/wardrobe-cloud/models/u2netp.onnx:/opt/wardrobe-models/u2netp.onnx:ro
      - /opt/wardrobe-cloud/secrets/qweather/ed25519-private.pem:/run/secrets/qweather/ed25519-private.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - wardrobe-cloud

  recommendation-worker:
    image: ${WARDROBE_API_IMAGE}
    restart: unless-stopped
    command: ["node", "dist/recommendations/worker-entry.js"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      DAILY_RECOMMENDATIONS_ENABLED: ${DAILY_RECOMMENDATIONS_ENABLED:-true}
      RECOMMENDATION_V2_SHADOW_ENABLED: ${RECOMMENDATION_V2_SHADOW_ENABLED:-false}
      RECOMMENDATION_V2_CURRENT_ENABLED: ${RECOMMENDATION_V2_CURRENT_ENABLED:-false}
      RECOMMENDATION_V2_WORKER_ENABLED: ${RECOMMENDATION_V2_WORKER_ENABLED:-false}
      RECOMMENDATION_REALTIME_ENABLED: ${RECOMMENDATION_REALTIME_ENABLED:-false}
      RECOMMENDATION_ACCEPT_ENABLED: ${RECOMMENDATION_ACCEPT_ENABLED:-false}
      PAW_DATE_CONTEXT_ENABLED: "false"
      PAW_CANDIDATE_EVALUATOR_ENABLED: "false"
      PAW_INTAKE_CANONICALIZER_ENABLED: "false"
      QWEATHER_ENABLED: ${QWEATHER_ENABLED:-false}
      QWEATHER_API_HOST: ${QWEATHER_API_HOST:-}
      QWEATHER_PROJECT_ID: ${QWEATHER_PROJECT_ID:-}
      QWEATHER_CREDENTIAL_ID: ${QWEATHER_CREDENTIAL_ID:-}
      QWEATHER_PRIVATE_KEY_FILE: /run/secrets/qweather/ed25519-private.pem
      QWEATHER_ALERTS_ENABLED: "false"
      HISTORICAL_CLIMATE_ENABLED: "false"
    volumes:
      - /opt/wardrobe-cloud/secrets/qweather/ed25519-private.pem:/run/secrets/qweather/ed25519-private.pem:ro
    networks:
      - wardrobe-cloud

networks:
  wardrobe-cloud:
    driver: bridge

volumes:
  wardrobe-postgres-data:
